/**/controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


/**/diff_drive_controller:
  ros__parameters:

    left_wheel_names:
      - fl_wheel_joint
      - bl_wheel_joint

    right_wheel_names:
      - fr_wheel_joint
      - br_wheel_joint

    wheel_separation: 0.30
    wheel_radius: 0.05

    publish_rate: 50.0

    base_frame_id: base_link

    use_stamped_vel: false

    cmd_vel_timeout: 0.5

    enable_odom_tf: true

    odom_frame_id: odom
